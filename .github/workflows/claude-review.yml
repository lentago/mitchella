# ============================================================================
# Claude Code — Automated PR Review (advisory)
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml, per
# lentago/.github ADR-0013. Copied from repo-template's claude-review.yml;
# only the review_prompt differs.
#
# - Runs when a PR is opened or marked ready for review, and again when it is
#   labelled `re-review` (Haiku) or `review:sonnet` (Sonnet). It does NOT run on
#   every push: it shares the fleet's Claude subscription with the bullpen.
# - Advisory, never a required status check (shared-workflows ADR-0003). The
#   gate is the arming rule: don't arm until a review has posted and every
#   finding is triaged on the PR (shared-workflows CLAUDE.md, Auto-merge
#   arming). A "could not complete" soft-fail comment is not a review —
#   label `re-review`.
# - After a labelled run, `clear-label` removes the label so adding it again
#   triggers again.
# - A PR that adds or changes THIS file is not reviewed by it: the Claude Code
#   action skips unless the workflow is identical to the default branch's copy,
#   and the reusable workflow (v1.5.0+) posts a "not a review" notice instead.
#   Review such PRs locally and post the result as "Review (Haiku, local)"
#   (ADR-0013 Decision 2).
# - Dependabot PRs are skipped: Dependabot runs don't receive Actions secrets,
#   so the required token would fail the call. Review a bump locally if it
#   warrants one.
# - Drafts are skipped (by the reusable workflow) and keep their trigger label
#   until they are ready.
# ============================================================================

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 're-review' ||
       github.event.label.name == 'review:sonnet')
    # One review at a time per PR: a re-label during a running review queues
    # behind it instead of posting a duplicate.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@v1.5.0
    secrets: inherit
    with:
      model: ${{ github.event.label.name == 'review:sonnet' && 'sonnet' || 'haiku' }}
      review_prompt: |
        This repository is lentago/mitchella, a corpus-backed chat assistant
        (the "front desk") for the Lentago estate. It answers operator
        questions from markdown in corpus/, checks live signals before it
        answers, and drafts a ticket for a human when it can't. The core is
        Python (stdlib plus `anthropic`) and UI-agnostic; Slack and the CLI are
        frontends. Focus your review on:

        - **Cached-prefix stability**: nothing per-request (clock, username,
          incident list, conditional sections) may render into the system
          prompt. The prefix must stay byte-identical across turns or the
          prompt cache silently stops hitting. Flag any edit that weakens
          `test_nothing_volatile_renders_into_the_cached_prefix`.
        - **Code-enforced gates**: the incident gate (`Engine._to_answer`
          upgrading `answered` to `incident`) must stay in Python, not move
          into prompt text. A signal source that can't be read is unknown,
          never healthy, and every frontend must surface it; flag any path that
          drops or swallows a degraded signal.
        - **No write access**: mitchella has no tools, no submit button and no
          side effects; actionable requests yield a draft. Flag anything that
          adds a write path, and any runtime write to `corpus/` (it changes on
          merge only; `jobs/promote.py` proposes onto a branch for review).
        - **Model-call shape**: in `engine.py` and `jobs/promote.py`, flag
          request parameters the current API rejects (`budget_tokens`,
          assistant prefill, `output_format`). The expected shape is adaptive
          thinking, `output_config` for effort and format, one cache
          breakpoint on the last system block, and live state as a system
          message after the history.
        - **Frontend boundary**: frontends import `mitchella` and nothing
          deeper, and adding one must not require edits outside
          `frontends/<name>/`. Keep `slack-bolt` out of the core, and flag new
          runtime dependencies in the core beyond `anthropic`.
        - **Corpus and tests**: corpus entries need valid frontmatter (`id`,
          `title`, `tags`, `volatility` of `stable` or `live`), malformed ones
          must fail loudly rather than be skipped, and a state-dependent answer
          should be `live`. New engine behaviour wants a test of a guarantee
          that holds whatever the model says (the suite uses a fake client and
          makes no API calls). A decision that would surprise a reviewer needs
          an ADR in `docs/adr/`, superseding rather than editing an old one.

  clear-label:
    needs: review
    if: >-
      always() && github.event.action == 'labeled' &&
      github.event.pull_request.draft == false &&
      (github.event.label.name == 're-review' || github.event.label.name == 'review:sonnet')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trigger label so it can be added again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        # REST, not `gh pr edit`: the GraphQL path can trip on PR project
        # fields with GITHUB_TOKEN, and a label left behind would make the
        # next re-add a no-op (no `labeled` event).
        run: |
          enc=$(jq -rn --arg l "$LABEL" '$l|@uri')
          gh api --method DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null
