# ============================================================================
# docs-check — relative markdown link resolution
# ============================================================================
# Self-contained: the resolver lives in this repo at ci/check_docs_links.py.
#
# Deliberately NOT path-filtered: this serves as a required status check, and
# a required check whose workflow never triggers is held "Expected" forever,
# deadlocking every non-matching PR. The checker is cheap and skips fast when
# no markdown changed.
#
# The job's `name:` is pinned to "docs-check / docs-check" — the exact
# required-status-check context recorded in this repo's branch ruleset (a
# holdover from when this job called a reusable workflow, which GitHub
# Actions reports as "<caller job> / <called job>"). Changing it deadlocks
# every PR until the ruleset is updated to match.
# ============================================================================

name: docs-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  docs-check:
    name: docs-check / docs-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative markdown links
        run: python3 ci/check_docs_links.py --root .
