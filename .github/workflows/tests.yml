# ============================================================================
# tests — the engine's invariants
# ============================================================================
# Deliberately NOT path-filtered: a required status check whose workflow never
# triggers is held "Expected" forever and deadlocks every non-matching PR.
#
# The suite runs against a fake client and makes no API calls, so it needs no
# secret and costs nothing.
#
# Runs on push to `main` only (pull requests cover every other branch; a bare
# `push:` ran each PR commit twice). Two reasons it runs on push at all: `main` should be verified after a merge, not
# only before it, and a repository's first commit has no pull request to run
# on — the branch ruleset requires these contexts, and a context that has never
# reported cannot be satisfied. Running on push is what lets the initial commit
# land. Branch pushes are
# covered by the pull_request trigger, so they need no push run.
# ============================================================================

name: tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  tests:
    name: tests / pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
