# ============================================================================
# tests — the engine's invariants
# ============================================================================
# Deliberately NOT path-filtered: a required status check whose workflow never
# triggers is held "Expected" forever and deadlocks every non-matching PR.
#
# The suite runs against a fake client and makes no API calls, so it needs no
# secret and costs nothing.
# ============================================================================

name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  tests:
    name: tests / pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
