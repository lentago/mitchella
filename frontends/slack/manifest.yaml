# Slack app manifest for mitchella.
#
# Create the app from this rather than clicking through scopes:
#   api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
#
# Then, in order:
#   1. Basic Information -> App-Level Tokens -> Generate: scope `connections:write`
#      -> this is SLACK_APP_TOKEN (xapp-...)
#   2. Install to Workspace -> OAuth & Permissions -> Bot User OAuth Token
#      -> this is SLACK_BOT_TOKEN (xoxb-...)
#
# Socket Mode is on, so no public URL, no tunnel, and no inbound firewall
# change. Nothing here grants write access to anything (ADR-0005): the bot
# reads mentions and DMs and posts replies. It cannot read channel history it
# was not mentioned in, and it holds no scopes for files, users, or admin.
display_information:
  name: mitchella
  description: Estate front desk. Checks live state, answers from documentation, drafts a ticket when it cannot.
  background_color: "#0e2b1a"

features:
  bot_user:
    display_name: mitchella
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      # Read the mention that summons it, and the DM that asks it something.
      - app_mentions:read
      - im:history
      - im:read
      # Reply.
      - chat:write
      - im:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
