[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitchella"
version = "0.1.0"
description = "Corpus-backed front desk for an infrastructure estate: signals first, then documentation, then a human."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
slack = ["slack-bolt>=1.18"]
dev = ["pytest>=8"]

[project.scripts]
mitchella = "frontends.cli.main:main"

[tool.setuptools]
packages = ["mitchella", "frontends", "frontends.cli", "frontends.slack", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
